manifest_version: 2
name: speechify
version: 0.1.2
description: "Speechify text-to-speech for Hermes Agent: Simba 3.5 voices in 48 languages with low-latency streaming."
author: Speechify
kind: backend
license: MIT
homepage: https://github.com/Speechify-AI/hermes-speechify
tags: [tts, voice, speechify]
requires_hermes: ">=0.21.5"
requires_env:
  - name: SPEECHIFY_API_KEY
    description: "Speechify API key for text-to-speech"
    url: "https://platform.speechify.ai/signup?utm_source=hermes&utm_medium=integration&utm_campaign=hermes-agent"
    secret: true
